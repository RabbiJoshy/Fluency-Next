[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluency-next"
version = "0.0.1"
description = "Local-first language learning pipeline and application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
wsd-es = [
  "google-genai>=1.0",
  "joblib>=1.4",
  "numpy>=2.0",
  "spacy>=3.8",
  "spacy-transformers>=1.3",
  "torch>=2.5",
  "transformers>=4.48",
]

[project.scripts]
fluency = "fluency.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
