<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fluency Next — Local Bootstrap</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #111827;
        color: #f9fafb;
      }

      main {
        width: min(36rem, calc(100% - 3rem));
        padding: 2.5rem;
        border: 1px solid #374151;
        border-radius: 1rem;
        background: #1f2937;
      }

      strong {
        color: #86efac;
      }
    </style>
  </head>
  <body>
    <main>
      <p><strong>Local bootstrap is working.</strong></p>
      <h1>Fluency Next</h1>
      <p>
        No language pipeline, production data, service worker, or remote service
        is connected yet.
      </p>
    </main>
  </body>
</html>
