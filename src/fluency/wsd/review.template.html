<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>French WSD Gold Review</title>
  <style>
    :root { color-scheme: light; --ink:#182026; --muted:#66727b; --line:#d9dee2; --paper:#fff; --wash:#f3f5f6; --accent:#176b87; --accent2:#dceff5; --warn:#8b4b12; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--wash); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,textarea,input { font:inherit; }
    header { position:sticky; top:0; z-index:3; background:rgba(255,255,255,.96); border-bottom:1px solid var(--line); padding:14px 20px; backdrop-filter:blur(10px); }
    .bar { max-width:1080px; margin:auto; display:flex; gap:14px; align-items:center; }
    .brand { font-weight:750; white-space:nowrap; }
    .progress { flex:1; height:8px; overflow:hidden; border-radius:8px; background:#e6eaed; }
    .progress > i { display:block; height:100%; background:var(--accent); width:0; transition:width .2s; }
    .count { min-width:105px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
    main { max-width:1080px; margin:24px auto 80px; padding:0 20px; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 8px 30px rgba(28,40,48,.06); }
    .meta { display:flex; flex-wrap:wrap; gap:8px; color:var(--muted); margin-bottom:14px; }
    .pill { background:var(--wash); border:1px solid var(--line); border-radius:999px; padding:3px 9px; }
    h1 { margin:0 0 10px; font-size:32px; letter-spacing:-.02em; }
    .sentence { font-size:25px; line-height:1.35; margin:6px 0; }
    mark { background:#fff0a8; border-radius:4px; padding:0 2px; }
    .translation { font-size:18px; color:#3e4a52; margin-bottom:8px; }
    .provenance { color:var(--muted); font-size:13px; }
    .analyses { margin-top:22px; display:grid; gap:14px; }
    .analysis { border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .analysis-title { padding:10px 13px; background:var(--wash); display:flex; gap:8px; align-items:baseline; }
    .analysis-title strong { font-size:17px; }
    .resolution { color:var(--muted); font-size:12px; margin-left:auto; }
    label.sense { display:block; padding:12px 14px; border-top:1px solid var(--line); cursor:pointer; }
    label.sense:hover { background:#f8fbfc; }
    label.sense.selected { background:var(--accent2); }
    .sense-line { display:flex; gap:10px; align-items:flex-start; }
    .gloss { font-weight:650; }
    .definition,.tags,.examples { color:var(--muted); font-size:13px; margin:3px 0 0 27px; }
    .examples { color:#46545d; }
    .specials { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px; }
    .specials label { border:1px solid var(--line); border-radius:10px; padding:11px; cursor:pointer; text-align:center; }
    .specials label.selected { border-color:var(--accent); background:var(--accent2); }
    textarea { width:100%; min-height:70px; margin-top:14px; padding:10px; border:1px solid var(--line); border-radius:10px; resize:vertical; }
    .nav { display:flex; gap:10px; align-items:center; margin-top:18px; }
    button { border:1px solid var(--line); background:white; border-radius:9px; padding:9px 13px; cursor:pointer; }
    button.primary { color:white; background:var(--accent); border-color:var(--accent); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .spacer { flex:1; }
    .jump { width:72px; padding:8px; border:1px solid var(--line); border-radius:8px; }
    .tools { margin-top:16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; color:var(--muted); }
    .warning { color:var(--warn); font-size:13px; }
    input[type=file] { display:none; }
    @media (max-width:700px) { .specials{grid-template-columns:1fr}.bar{flex-wrap:wrap}.progress{order:3;flex-basis:100%}.sentence{font-size:21px}.nav{flex-wrap:wrap}.spacer{display:none} }
  </style>
</head>
<body>
<header><div class="bar"><div class="brand">French WSD Gold Review</div><div class="progress"><i id="progressBar"></i></div><div class="count" id="progressText"></div></div></header>
<main>
  <section class="panel">
    <div class="meta" id="meta"></div>
    <h1 id="surface"></h1>
    <div class="sentence" id="sentence"></div>
    <div class="translation" id="translation"></div>
    <div class="provenance" id="provenance"></div>
    <div class="analyses" id="analyses"></div>
    <div class="specials" id="specials"></div>
    <textarea id="notes" placeholder="Optional note about ambiguity, bad menu structure, translation, or morphology"></textarea>
    <div class="nav">
      <button id="previous">← Previous</button>
      <button class="primary" id="next">Save & next →</button>
      <button id="nextUnlabelled">Next unlabelled</button>
      <span class="spacer"></span>
      <label>Row <input class="jump" id="jump" type="number" min="1" max="120"></label>
    </div>
    <div class="tools">
      <button id="export">Export labels.json</button>
      <label for="importFile"><span role="button">Import labels.json</span></label>
      <input id="importFile" type="file" accept="application/json,.json">
      <button id="clearCurrent">Clear current label</button>
      <span class="warning">Prediction-blind: no model output is present in this file.</span>
    </div>
  </section>
</main>
<script id="benchmark-data" type="application/json">__BENCHMARK_JSON__</script>
<script>
  const benchmark = JSON.parse(document.getElementById('benchmark-data').textContent);
  const storageKey = `fluency-wsd-gold:${benchmark.benchmark_id}`;
  let state = { schema_version:'wsd-gold-labels/v1', benchmark_id:benchmark.benchmark_id, labels:{} };
  try { const saved=JSON.parse(localStorage.getItem(storageKey)); if(saved?.benchmark_id===benchmark.benchmark_id) state=saved; } catch (_) {}
  let index=0;
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function highlight(text, surface){ const safe=esc(text); const needle=esc(surface).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); return safe.replace(new RegExp(`(^|[^\\p{L}\\p{N}])(${needle})(?=$|[^\\p{L}\\p{N}])`,'giu'),'$1<mark>$2</mark>'); }
  function current(){ return benchmark.rows[index]; }
  function label(){ return state.labels[current().benchmark_row_id] || {status:null,menu_analysis_id:null,sense_id:null,notes:''}; }
  function persist(){ localStorage.setItem(storageKey,JSON.stringify(state)); updateProgress(); }
  function choose(status,analysisId=null,senseId=null){ state.labels[current().benchmark_row_id]={...label(),status,menu_analysis_id:analysisId,sense_id:senseId,notes:$('notes').value}; persist(); render(); }
  function updateProgress(){ const done=Object.values(state.labels).filter(x=>x.status).length; $('progressText').textContent=`${done} / ${benchmark.rows.length} labelled`; $('progressBar').style.width=`${100*done/benchmark.rows.length}%`; }
  function render(){
    const row=current(), saved=label(), src=row.sentence.source, target=row.sentence.target, trans=row.sentence.translation;
    $('meta').innerHTML=`<span class="pill">${esc(row.stratum.replaceAll('_',' '))}</span><span class="pill">rank ${row.card.rank}</span><span class="pill">row ${index+1} / ${benchmark.rows.length}</span>`;
    $('surface').textContent=row.card.surface_form;
    $('sentence').innerHTML=highlight(target.text,row.card.surface_form);
    $('translation').textContent=trans.text;
    $('provenance').textContent=`Tatoeba #${target.source_sentence_id} by ${target.contributor} · English #${trans.source_sentence_id} by ${trans.contributor}`;
    $('analyses').innerHTML=row.analyses.map(a=>`<section class="analysis"><div class="analysis-title"><strong>${esc(a.headword)}</strong><span>${esc(a.part_of_speech)}</span><span class="resolution">${esc(a.resolution)}${a.resolution_path?.length?' · '+esc(a.resolution_path.join(' → ')):''}</span></div>${a.senses.map(s=>`<label class="sense ${saved.status==='assigned'&&saved.sense_id===s.sense_id?'selected':''}"><div class="sense-line"><input type="radio" name="decision" ${saved.status==='assigned'&&saved.sense_id===s.sense_id?'checked':''} data-analysis="${esc(a.menu_analysis_id)}" data-sense="${esc(s.sense_id)}"><div><div class="gloss">${esc(s.translation||'(no gloss)')}</div></div></div>${s.definition?`<div class="definition">${esc(s.definition)}</div>`:''}${s.tags?.length?`<div class="tags">${esc(s.tags.join(' · '))}</div>`:''}${s.examples?.length?`<div class="examples">${s.examples.map(e=>`${esc(e.text)} — ${esc(e.translation)}`).join('<br>')}</div>`:''}</label>`).join('')}</section>`).join('');
    document.querySelectorAll('input[data-sense]').forEach(input=>input.addEventListener('change',()=>choose('assigned',input.dataset.analysis,input.dataset.sense)));
    const options=[['no_listed_sense','No listed sense'],['bad_pair','Bad sentence/translation'],['unsure','Unsure / revisit']];
    $('specials').innerHTML=options.map(([value,title])=>`<label class="${saved.status===value?'selected':''}"><input type="radio" name="decision" ${saved.status===value?'checked':''} data-special="${value}"> ${title}</label>`).join('');
    document.querySelectorAll('input[data-special]').forEach(input=>input.addEventListener('change',()=>choose(input.dataset.special)));
    $('notes').value=saved.notes||'';
    $('previous').disabled=index===0; $('next').disabled=index===benchmark.rows.length-1; $('jump').value=index+1;
    updateProgress();
  }
  $('notes').addEventListener('input',()=>{ if(state.labels[current().benchmark_row_id]) { state.labels[current().benchmark_row_id].notes=$('notes').value; persist(); } });
  $('previous').onclick=()=>{ if(index>0){index--;render();scrollTo(0,0);} };
  $('next').onclick=()=>{ if(index<benchmark.rows.length-1){index++;render();scrollTo(0,0);} };
  $('nextUnlabelled').onclick=()=>{ const next=benchmark.rows.findIndex((row,i)=>i>index&&!state.labels[row.benchmark_row_id]?.status); const wrap=benchmark.rows.findIndex(row=>!state.labels[row.benchmark_row_id]?.status); const found=next>=0?next:wrap; if(found>=0){index=found;render();scrollTo(0,0);} };
  $('jump').onchange=()=>{ index=Math.max(0,Math.min(benchmark.rows.length-1,Number($('jump').value)-1));render(); };
  $('clearCurrent').onclick=()=>{ delete state.labels[current().benchmark_row_id];persist();render(); };
  $('export').onclick=()=>{ const payload={...state,exported_at:new Date().toISOString(),row_count:benchmark.rows.length}; const blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`french-wsd-gold-${benchmark.benchmark_id.slice(-12)}.json`;a.click();URL.revokeObjectURL(a.href); };
  $('importFile').onchange=async event=>{ const incoming=JSON.parse(await event.target.files[0].text()); if(incoming.benchmark_id!==benchmark.benchmark_id||incoming.schema_version!=='wsd-gold-labels/v1'){alert('This label file belongs to a different benchmark.');return;} state={schema_version:incoming.schema_version,benchmark_id:incoming.benchmark_id,labels:incoming.labels||{}};persist();render(); };
  render();
</script>
</body>
</html>
