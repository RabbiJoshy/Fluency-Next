[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluency-next"
version = "0.0.1"
description = "Local-first language learning pipeline and application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
# Cognate mapping runs offline, once, to produce a map that then ships as data.
# panphon carries the 6,367-segment IPA feature table behind the pronunciation
# tier of the form score; nothing at runtime and nothing in the app needs it.
cognates = [
  "panphon>=0.22",
]
wsd-es = [
  "google-genai>=1.0",
  "joblib>=1.4",
  "numpy>=2.0",
  "spacy>=3.8",
  "spacy-transformers>=1.3",
  "torch>=2.5",
  "transformers>=4.48",
]
# Test/dev tooling. `scikit-learn` backs the research WSD probes that a few
# tests import; `pytest` is the runner named in CLAUDE.md and REPO_MAP.md.
dev = [
  "pytest>=8.0",
  "scikit-learn>=1.4",
]

[project.scripts]
fluency = "fluency.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
